name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      # As regras do Firestore são a fronteira de segurança do sistema multi-tenant:
      # cada caso desta suíte é o ataque de um achado da auditoria, escrito. Precisa de
      # Java (o emulador roda na JVM) e da flag de web frameworks, porque o firebase.json
      # declara o Hosting por framework.
      - name: Preparar emulador do Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Testes das regras do Firestore
        run: |
          npx firebase experiments:enable webframeworks
          npm run test:rules

      - name: Build
        run: npm run build
        env:
          # Chaves do app Web do Firebase não são segredas (vão pro bundle do
          # cliente de qualquer forma). Necessárias no build porque o SDK do
          # cliente é inicializado durante a geração estática de algumas rotas.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyD3kuQ1tQ7ZP0Rt1RDhicJWXzKetszTME8' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ocartel-497f8.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ocartel-497f8
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ocartel-497f8.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "604756121837"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:604756121837:web:467e5c00fef4a0ca7694e4"
